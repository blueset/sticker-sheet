title:
  en: pedantic Inc. Podcasts
  zh-Hans: pedantic Inc. 系列播客
  ja: 株式会社 pedantic 系列ポッドキャスト
description:
  en: |
    Besides [**Yuru Gengo-gaku Radio**](#yurugengo) and [**Yuru Computer Kagaku Radio**](#yurucom), I also listen to other podcasts from [pedantic Inc.](https://pedantic.jp/)

    - *Yuru Tenmon-gaku Radio* ([Website](https://yurugakuto.com/tenmon), [YouTube](https://www.youtube.com/@yurutenmon))
    - *Yuru Minzoku-gaku Radio* ([Website](https://yurugakuto.com/minzoku), [YouTube](https://www.youtube.com/@yuruminzoku))
    - *Hakushi to Dokeshi* ([YouTube](https://www.youtube.com/@hakushi-to-dokeshi))
    - *Shirokuro Tsukenai Kaigi* ([Website](https://cybozu.co.jp/not-shirokuro/), [YouTube](https://www.youtube.com/@not_shirokuro))
    - *Bonno Dokomademo* ([YouTube](https://www.youtube.com/@bon-doko))
    - *pedantic Inc.* ([YouTube](https://www.youtube.com/@pedanticInc))
  zh-Hans: |
    除了[**《Yuru 言語学 Radio》**](#yurugengo)和[**《Yuru Computer 科学 Radio》**](#yurucom)，我也收听 [pedantic 株式会社](https://pedantic.jp/) 的其他播客。

    - 《Yuru 天文学 Radio》 ([Website](https://yurugakuto.com/tenmon), [YouTube](https://www.youtube.com/@yurutenmon))
    - 《Yuru 民俗学 Radio》 ([Website](https://yurugakuto.com/minzoku), [YouTube](https://www.youtube.com/@yuruminzoku))
    - 《博士 to 道化师》 ([YouTube](https://www.youtube.com/@hakushi-to-dokeshi))
    - 《白黑 Tsukenai 会议》 ([Website](https://cybozu.co.jp/not-shirokuro/), [YouTube](https://www.youtube.com/@not_shirokuro))
    - 《烦恼 Dokomademo》 ([YouTube](https://www.youtube.com/@bon-doko))
    - 《株式会社 pedantic》 ([YouTube](https://www.youtube.com/@pedanticInc))
  ja: |
    [『ゆる言語学ラジオ』](#yurugengo)と[『ゆるコンピュータ科学ラジオ』](#yurucom)以外に、[株式会社 pedantic](https://pedantic.jp/) の他のポッドキャストも聞いています。

    - 『ゆる天文学ラジオ』 ([Website](https://yurugakuto.com/tenmon), [YouTube](https://www.youtube.com/@yurutenmon))
    - 『ゆる民俗学ラジオ』 ([Website](https://yurugakuto.com/minzoku), [YouTube](https://www.youtube.com/@yuruminzoku))
    - 『博士と道化師』([YouTube](https://www.youtube.com/@hakushi-to-dokeshi))
    - 『白黒つけない会議』([Website](https://cybozu.co.jp/not-shirokuro/), [YouTube](https://www.youtube.com/@not_shirokuro))
    - 『煩悩どこまでも』([YouTube](https://www.youtube.com/@bon-doko))
    - 『株式会社 pedantic』([YouTube](https://www.youtube.com/@pedanticInc))
